repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e
    hooks:
      - id: gitleaks
        args: [--no-banner]
  - repo: local
    hooks:
      - id: mypy-domain
        name: mypy domain
        entry: mypy domain
        language: system
        pass_filenames: false
