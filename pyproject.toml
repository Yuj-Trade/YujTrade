[project]
name = "yujtrade"
version = "6.0.0"
description = "Long-term crypto trading signal bot with Telegram delivery"
requires-python = ">=3.13,<3.14"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = [
    "app*",
    "analysis*",
    "application*",
    "backtesting*",
    "common*",
    "config*",
    "data*",
    "domain*",
    "features*",
    "modeling*",
    "services*",
    "strategy*",
    "trading*",
    "utils*",
]
exclude = ["Main*", "skills*", "copyfile*", "logs*", "models*", "runs*", "tests*"]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.0.0",
    "ruff==0.13.1",
    "mypy==1.18.2",
    "pre-commit==4.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "talib: test requires TA-Lib",
    "integration: integration test",
    "slow: slow test",
    "ml: test requires machine-learning artifacts",
]

[tool.ruff]
line-length = 100
extend-exclude = ["Main", "skills", "copyfile"]
lint.select = ["E", "F", "I", "B", "UP", "BLE"]

[tool.ruff.lint.per-file-ignores]
"analysis/market_analyzer.py" = ["BLE001"]
"analysis/scoring.py" = ["BLE001"]
"app/tasks.py" = ["BLE001"]
"app/telegram_bot.py" = ["BLE001"]
"backtesting/historical_signals.py" = ["BLE001"]
"common/constants.py" = ["BLE001"]
"common/metrics.py" = ["BLE001"]
"common/utils.py" = ["BLE001"]
"config/settings.py" = ["BLE001"]
"data/data_provider.py" = ["BLE001"]
"data/sources/alphavantage_fetcher.py" = ["BLE001"]
"data/sources/base_fetcher.py" = ["BLE001"]
"data/sources/binance_fetcher.py" = ["BLE001"]
"data/sources/coindesk_fetcher.py" = ["BLE001"]
"data/sources/coingecko_fetcher.py" = ["BLE001"]
"data/sources/marketindices_fetcher.py" = ["BLE001"]
"data/sources/messari_fetcher.py" = ["BLE001"]
"data/sources/news_fetcher.py" = ["BLE001"]
"features/feature_engineering.py" = ["BLE001"]
"main.py" = ["BLE001"]
"modeling/model_manager.py" = ["BLE001"]
"modeling/models.py" = ["BLE001"]
"modeling/optimization.py" = ["BLE001"]
"scripts/docker_healthcheck.py" = ["BLE001"]
"scripts/run_golden.py" = ["BLE001"]
"scripts/train_models.py" = ["BLE001"]
"services/trading_service.py" = ["BLE001"]
"strategy/multi_timeframe.py" = ["BLE001"]
"strategy/signal_generator.py" = ["BLE001"]
"tests/golden/record_signals.py" = ["BLE001"]
"trading/execution.py" = ["BLE001"]
"utils/background_manager.py" = ["BLE001"]
"utils/resource_manager.py" = ["BLE001"]
"utils/security.py" = ["BLE001"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["domain"]

[[tool.mypy.overrides]]
module = ["*"]
ignore_errors = true
